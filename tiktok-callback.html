<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUDO DE GTA6 · Autorização</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0C0C0C; color: #FFFFFF;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { max-width: 640px; width: 100%; }
  h1 { color: #B6FF00; font-size: 28px; }
  code { display: block; background: #231A47; border: 2px solid #3A2E66; border-radius: 12px; padding: 16px;
         font-size: 18px; word-break: break-all; margin: 16px 0; }
  button { background: #FFE600; color: #0C0C0C; border: 0; border-radius: 999px; padding: 12px 24px;
           font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Autorização recebida</h1>
  <p id="msg">Copie o código abaixo e cole no terminal onde você rodou <b>configurar.py tiktok</b>.</p>
  <code id="codigo">—</code>
  <button id="copiar">Copiar código</button>
</main>
<script>
  const p = new URLSearchParams(location.search);
  const codigo = p.get("code");
  const el = document.getElementById("codigo");
  if (codigo) { el.textContent = codigo; }
  else { document.getElementById("msg").textContent = "Nenhum código recebido. Erro: " + (p.get("error_description") || p.get("error") || "desconhecido"); }
  document.getElementById("copiar").onclick = () => navigator.clipboard.writeText(codigo || "");
</script>
</body>
</html>
